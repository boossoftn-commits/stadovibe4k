<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تيتان لايف PRO | باقة beIN MAX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --bg-main: #0b0f19; --bg-cards: #111827; --primary: #8b5cf6; --accent: #f59e0b; --text-color: #f8fafc; --sport-max: #4c1d95; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-color); padding-bottom: 40px; }
        header { background: rgba(17, 24, 39, 0.9); padding: 20px; text-align: center; border-bottom: 1px solid #1f2937; }
        .logo { font-size: 24px; font-weight: 900; color: #fff; text-decoration: none; }
        .main-layout { max-width: 1200px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr; gap: 25px; }
        .player-section { background-color: var(--bg-cards); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; position: relative; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* تصميم زر الدعم أسفل الفيديو */
        .ad-support-btn { display: block; padding: 12px; text-align: center; background: #1e293b; color: var(--text-color); font-weight: bold; text-decoration: none; border-top: 1px solid #334155; transition: 0.3s; }
        .ad-support-btn:hover { background: var(--primary); color: #fff; }
        
        .player-info { padding: 15px; background: #070a12; text-align: center; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .channel-card { background-color: var(--bg-cards); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; border: 2px solid #1e293b; transition: 0.3s; }
        .channel-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .max-logo { background: var(--sport-max); width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        @media (min-width: 768px) { .main-layout { grid-template-columns: 1fr 2fr; } }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">👑 تيتان لايف | باقة <span>beIN SPORTS</span></a>
    </header>

    <main class="main-layout">
        <div class="content-wrapper">
            <h3 style="margin-bottom: 15px;">📺 اختر القناة:</h3>
            <div class="channels-grid">
                <div class="channel-card" onclick="changeChannel('beIN Sports MAX 1', 'https://dlhd.pk/player/stream-91.php')"><div class="max-logo">MAX 1</div><div>beIN 1</div></div>
                <div class="channel-card" onclick="changeChannel('beIN Sports MAX 2', 'https://dlhd.pk/player/stream-92.php')"><div class="max-logo">MAX 2</div><div>beIN 2</div></div>
                <div class="channel-card" onclick="changeChannel('beIN Sports MAX 3', 'https://dlhd.pk/stream/stream-93.php')"><div class="max-logo">MAX 3</div><div>beIN 3</div></div>
                <div class="channel-card" onclick="changeChannel('beIN Sports MAX 4', 'https://dlhd.pk/stream/stream-94.php')"><div class="max-logo">MAX 4</div><div>beIN 4</div></div>
                <div class="channel-card" onclick="changeChannel('beIN Sports MAX 5', 'https://dlhd.pk/stream/stream-95.php')"><div class="max-logo">MAX 5</div><div>beIN 5</div></div>
            </div>
        </div>

        <div class="player-wrapper">
            <div class="player-section">
                <div class="video-container">
                    <iframe id="main-iframe" src="https://dlhd.pk/player/stream-91.php" allowfullscreen></iframe>
                </div>
                
                <a href="https://kangaroolame.com/fmk5wtw0?key=d75a4ba05e732934fa5f3cd0fb4d5c11" target="_blank" class="ad-support-btn">
                    📺 اضغط هنا لدعم الموقع ومشاهدة البث بجودة عالية
                </a>
                
                <div class="player-info">
                    <h2 id="current-channel-name">جاري عرض: beIN Sports MAX 1</h2>
                </div>
            </div>
        </div>
    </main>

    <script>
        function changeChannel(name, url) {
            document.getElementById('current-channel-name').innerText = "جاري عرض: " + name;
            document.getElementById('main-iframe').src = url;
        }
    </script>
</body>
</html>
